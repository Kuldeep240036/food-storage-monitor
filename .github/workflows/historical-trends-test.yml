name: Historical Trends Test

on:
  push:
    branches:
      - feature/historical-trends
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SCRUM-11 test
        run: python historical_trends_test.py
