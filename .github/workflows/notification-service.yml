name: Notification Service Test

on:
  push:
    branches:
      - feature/mobile-sms-notifications
  workflow_dispatch:

jobs:
  test-notification-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notification service test
        run: python test_notification_service.py
